name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.result.outputs.published }}
      version: ${{ steps.result.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      # The tag lives on HEAD when semantic-release produced a release; on a
      # plain push HEAD carries no tag, so nothing downstream must run.
      - id: result
        run: |
          set -eu
          if tag=$(git describe --tags --exact-match 2>/dev/null); then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build x86_64 archive
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    outputs:
      version: ${{ needs.release.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
      glibc: ${{ steps.package.outputs.glibc }}
    steps:
      - name: System dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          git cmake ninja vulkan-headers spirv-headers vulkan-icd-loader
          shaderc glslang alsa-lib blas cblas libxkbcommon libxcb rust github-cli
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-release-
      # TRANSCRIBE_X86_CONSERVATIVE is the crate's own SIGILL-safe switch: it
      # turns GGML_NATIVE and every x86 SIMD tier off, so the published binary
      # runs on baseline x86-64 instead of the runner's CPU.
      - name: Build
        env:
          TRANSCRIBE_CMAKE_ARGS: -DTRANSCRIBE_X86_CONSERVATIVE=ON
        run: cargo build --release --locked
      - name: Package
        id: package
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -eu
          dir="dist/littera-$VERSION-x86_64"
          mkdir -p "$dir"
          install -Dm755 target/release/littera "$dir/littera"
          strip "$dir/littera"
          install -Dm644 assets/icon/littera.desktop "$dir/littera.desktop"
          install -d "$dir/icons"
          cp -R assets/icon/hicolor "$dir/icons/hicolor"
          install -Dm644 LICENSE "$dir/LICENSE"
          archive="littera-$VERSION-x86_64.tar.gz"
          tar -C dist -czf "$archive" "littera-$VERSION-x86_64"
          sha256sum "$archive" | cut -d' ' -f1 > "$archive.sha256"
          # The AUR recipe installs from icons/hicolor; a flat icons/ tree
          # breaks package() and is invisible to a checksum check.
          tar tzf "$archive" | grep -q 'icons/hicolor/16x16/apps/littera.png'
          echo "sha256=$(cat "$archive.sha256")" >> "$GITHUB_OUTPUT"
          # The AUR package declares the glibc it was actually built against,
          # so pacman refuses the install on a system older than this build.
          glibc=$(readelf --version-info "$dir/littera" | grep -o 'GLIBC_[0-9][0-9.]*' | sort -Vu | tail -1 | cut -d_ -f2)
          echo "glibc=$glibc" >> "$GITHUB_OUTPUT"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -eu
          archive="littera-$VERSION-x86_64.tar.gz"
          gh release upload "v$VERSION" "$archive" "$archive.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  deb:
    name: build amd64 deb
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-24.04
    # Pinned to the oldest supported userland. The control file derives
    # `libc6 (>= …)` from the binary actually built here, so a newer image
    # would silently raise the .deb's floor.
    container: ubuntu:24.04
    steps:
      - name: System dependencies
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl ca-certificates \
            libasound2-dev libvulkan-dev glslc glslang-tools spirv-headers \
            libxkbcommon-dev libxcb1-dev
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      # Separate key prefix: this target tree belongs to the noble toolchain,
      # never to the Arch container's.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: deb-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            deb-${{ runner.os }}-${{ runner.arch }}-
      - name: Rust toolchain
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # TRANSCRIBE_USE_SYSTEM_BLAS=OFF is explicit: Debian and Ubuntu keep
      # cblas.h outside the paths transcribe.cpp and build.rs probe, so the
      # host decoder would fall back silently. Pin that posture — the official
      # Python wheels ship it too — and skip libblas/libcblas entirely.
      - name: Build
        env:
          TRANSCRIBE_CMAKE_ARGS: -DTRANSCRIBE_X86_CONSERVATIVE=ON -DTRANSCRIBE_USE_SYSTEM_BLAS=OFF
        run: cargo build --release --locked
      - name: Package
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          root="dist/deb"
          install -Dm755 target/release/littera "$root/usr/bin/littera"
          strip "$root/usr/bin/littera"
          install -Dm644 assets/icon/littera.desktop "$root/usr/share/applications/littera.desktop"
          install -d "$root/usr/share/icons"
          cp -R assets/icon/hicolor "$root/usr/share/icons/"
          install -Dm644 LICENSE "$root/usr/share/doc/littera/copyright"
          gzip -9nc CHANGELOG.md > "$root/usr/share/doc/littera/changelog.gz"
          chmod -R u=rwX,go=rX "$root"
          install -d "$root/DEBIAN"
          # Same derivation as the AUR recipe: the highest glibc symbol the
          # binary actually needs is the Debian dependency floor.
          glibc=$(readelf --version-info "$root/usr/bin/littera" \
            | grep -o 'GLIBC_[0-9][0-9.]*' | sort -Vu | tail -1 | cut -d_ -f2)
          installed_size=$(du -sk --exclude=DEBIAN "$root" | cut -f1)
          sed -e "s|__VERSION__|$VERSION|g" \
              -e "s|__GLIBC__|$glibc|g" \
              -e "s|__INSTALLED_SIZE__|$installed_size|g" \
              packaging/debian/control.in > "$root/DEBIAN/control"
          chmod 644 "$root/DEBIAN/control"
          deb="littera_${VERSION}_amd64.deb"
          dpkg-deb --build --root-owner-group "$root" "$deb"
          sha256sum "$deb" | cut -d' ' -f1 > "$deb.sha256"
          contents=$(mktemp)
          dpkg-deb --contents "$deb" > "$contents"
          grep -q ' \./usr/bin/littera$' "$contents"
          grep -q ' \./usr/share/applications/littera.desktop$' "$contents"
          grep -q ' \./usr/share/icons/hicolor/16x16/apps/littera.png$' "$contents"
          rm -f "$contents"
          if ldd "$root/usr/bin/littera" | grep -q 'not found'; then
            echo "::error::the packaged binary has unresolved shared libraries"
            ldd "$root/usr/bin/littera"
            exit 1
          fi
          dpkg-deb --info "$deb"
      - name: Upload the deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: littera-deb-${{ needs.release.outputs.version }}
          path: |
            littera_${{ needs.release.outputs.version }}_amd64.deb
            littera_${{ needs.release.outputs.version }}_amd64.deb.sha256
          if-no-files-found: error

  deb-verify:
    name: verify and publish deb
    needs:
      - release
      - deb
    if: needs.release.outputs.published == 'true'
    # No job container: the fresh rootfs checks need the runner's Docker.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: littera-deb-${{ needs.release.outputs.version }}
          path: dist
      # A build container already carries every build dependency, so an
      # in-container `apt install` would prove nothing about Depends. Install
      # into pristine rootfs images instead, without Recommends, and run the
      # documented diagnostics command in each.
      - name: Install and smoke-test in fresh rootfs images
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -eu
          deb="dist/littera_${VERSION}_amd64.deb"
          test -f "$deb"
          test "$(sha256sum "$deb" | cut -d' ' -f1)" = "$(cat "$deb.sha256")"
          for image in ubuntu:24.04 debian:13; do
            echo "::group::$image"
            docker run --rm -e DEBIAN_FRONTEND=noninteractive \
              -v "$PWD/$deb:/tmp/littera.deb:ro" "$image" \
              sh -c '
                set -eu
                apt-get update
                apt-get install -y --no-install-recommends /tmp/littera.deb
                test -f /usr/bin/littera
                test -f /usr/share/applications/littera.desktop
                test -f /usr/share/icons/hicolor/256x256/apps/littera.png
                littera --diagnostics
              '
            echo "::endgroup::"
          done
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -eu
          gh release upload "v$VERSION" \
            "dist/littera_${VERSION}_amd64.deb" \
            "dist/littera_${VERSION}_amd64.deb.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

  aur:
    name: publish AUR
    needs:
      - release
      - build
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: System dependencies
        run: pacman -Syu --noconfirm --needed git openssh
      - uses: actions/checkout@v4
      - name: Render PKGBUILD
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          GLIBC: ${{ needs.build.outputs.glibc }}
          AUR_MAINTAINER_EMAIL: ${{ vars.AUR_MAINTAINER_EMAIL || 'rouhim@users.noreply.github.com' }}
        run: |
          set -eu
          mkdir -p aur-build
          sed -e "s|__VERSION__|$VERSION|g" \
              -e "s|__SHA256__|$SHA256|g" \
              -e "s|__GLIBC__|$GLIBC|g" \
              -e "s|__MAINTAINER_EMAIL__|$AUR_MAINTAINER_EMAIL|g" \
              packaging/PKGBUILD > aur-build/PKGBUILD
          cp packaging/littera-bin.install aur-build/littera-bin.install
          # makepkg refuses to run as root; .SRCINFO is the only thing needed.
          useradd --create-home builder
          chown -R builder:builder aur-build
          su builder -c "cd '$PWD/aur-build' && makepkg --printsrcinfo > .SRCINFO"
          # Build the recipe once before publishing it: downloads the release
          # asset, verifies its checksum and runs package(). A broken recipe
          # must fail here, not in every user's yay.
          su builder -c "cd '$PWD/aur-build' && makepkg -f --nodeps --noconfirm"
          chown -R root:root aur-build
      # The rendered files are uploaded for inspection and for a manual replay;
      # the push below is what actually creates the package on a first release.
      - name: Upload rendered PKGBUILD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: littera-bin-${{ needs.release.outputs.version }}
          include-hidden-files: true
          path: |
            aur-build/PKGBUILD
            aur-build/.SRCINFO
            aur-build/littera-bin.install
      - name: Push to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_USERNAME: ${{ vars.AUR_USERNAME || 'rouhim' }}
          AUR_MAINTAINER_EMAIL: ${{ vars.AUR_MAINTAINER_EMAIL || 'rouhim@users.noreply.github.com' }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -eu
          if [ -z "${AUR_SSH_KEY:-}" ]; then
            echo "::error::The AUR_SSH_KEY repository secret is not set. Add the passphrase-less key whose public half is registered in the AUR account (Settings -> Secrets and variables -> Actions), then re-run this job."
            exit 1
          fi
          install -d -m 700 /root/.ssh
          # Normalise paste artefacts (CRLF, leading/trailing blank lines) before
          # ssh ever looks at the key.
          printf '%s\n' "$AUR_SSH_KEY" | tr -d '\r' | awk 'NF' > /root/.ssh/aur
          chmod 600 /root/.ssh/aur
          if ! grep -q '^-----BEGIN .*PRIVATE KEY-----$' /root/.ssh/aur \
             || ! grep -q '^-----END .*PRIVATE KEY-----$' /root/.ssh/aur; then
            echo "::error::AUR_SSH_KEY does not contain a private key. Store the private key file (starts with '-----BEGIN OPENSSH PRIVATE KEY-----'), never the .pub, as the repository secret under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          install -Dm644 .github/aur_known_hosts /root/.ssh/known_hosts
          # Secrets cannot be read back after they are stored. The fingerprint
          # is public information (it is printed by `ssh-keygen -lf` on the
          # .pub too) and makes the stored key identifiable in the log.
          ssh-keygen -lf /root/.ssh/aur
          if ssh-keygen -y -P '' -f /root/.ssh/aur >/dev/null 2>&1; then
            echo "stored key: no passphrase"
          else
            echo "::warning::The stored key is passphrase-protected; BatchMode cannot answer the prompt."
          fi
          export GIT_SSH_COMMAND="ssh -i /root/.ssh/aur -o IdentitiesOnly=yes -o BatchMode=yes -o UserKnownHostsFile=/root/.ssh/known_hosts -o StrictHostKeyChecking=yes"

          if ! git clone --depth 1 ssh://aur@aur.archlinux.org/littera-bin.git aur 2>/tmp/clone.err; then
            cat /tmp/clone.err
            if grep -qiE 'permission denied|invalid format|no such identity' /tmp/clone.err; then
              echo "::error::AUR authentication failed. The public half of the AUR_SSH_KEY key must be registered at https://aur.archlinux.org/account/rouhim, and the secret must hold the passphrase-less private key."
            else
              echo "::error::The AUR remote could not be cloned although the key was accepted. Check the runner's network access and AUR's rate limit (repeated failed auth attempts are throttled per IP); the rendered PKGBUILD is in the littera-bin-$VERSION artifact."
            fi
            exit 1
          fi

          cp aur-build/PKGBUILD aur-build/.SRCINFO aur-build/littera-bin.install aur/

          cd aur
          git config user.name "$AUR_USERNAME"
          git config user.email "$AUR_MAINTAINER_EMAIL"
          git add PKGBUILD .SRCINFO littera-bin.install
          if git diff --cached --quiet; then
            echo "littera-bin is already at $VERSION-1"
            exit 0
          fi
          git commit -m "upgpkg: littera-bin $VERSION-1"
          git push origin master

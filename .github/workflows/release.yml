name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.result.outputs.published }}
      version: ${{ steps.result.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      # The tag lives on HEAD when semantic-release produced a release; on a
      # plain push HEAD carries no tag, so nothing downstream must run.
      - id: result
        run: |
          set -eu
          if tag=$(git describe --tags --exact-match 2>/dev/null); then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build x86_64 archive
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    outputs:
      version: ${{ needs.release.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
      glibc: ${{ steps.package.outputs.glibc }}
    steps:
      - name: System dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          git cmake ninja vulkan-headers spirv-headers vulkan-icd-loader
          shaderc glslang alsa-lib blas cblas libxkbcommon libxcb rust github-cli
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-release-
      # TRANSCRIBE_X86_CONSERVATIVE is the crate's own SIGILL-safe switch: it
      # turns GGML_NATIVE and every x86 SIMD tier off, so the published binary
      # runs on baseline x86-64 instead of the runner's CPU.
      - name: Build
        env:
          TRANSCRIBE_CMAKE_ARGS: -DTRANSCRIBE_X86_CONSERVATIVE=ON
        run: cargo build --release --locked
      - name: Package
        id: package
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -eu
          dir="dist/littera-$VERSION-x86_64"
          mkdir -p "$dir"
          install -Dm755 target/release/littera "$dir/littera"
          strip "$dir/littera"
          install -Dm644 assets/icon/littera.desktop "$dir/littera.desktop"
          cp -R assets/icon/hicolor "$dir/icons"
          install -Dm644 LICENSE "$dir/LICENSE"
          archive="littera-$VERSION-x86_64.tar.gz"
          tar -C dist -czf "$archive" "littera-$VERSION-x86_64"
          sha256sum "$archive" | cut -d' ' -f1 > "$archive.sha256"
          echo "sha256=$(cat "$archive.sha256")" >> "$GITHUB_OUTPUT"
          # The AUR package declares the glibc it was actually built against,
          # so pacman refuses the install on a system older than this build.
          glibc=$(readelf --version-info "$dir/littera" | grep -o 'GLIBC_[0-9][0-9.]*' | sort -Vu | tail -1 | cut -d_ -f2)
          echo "glibc=$glibc" >> "$GITHUB_OUTPUT"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -eu
          archive="littera-$VERSION-x86_64.tar.gz"
          gh release upload "v$VERSION" "$archive" "$archive.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  aur:
    name: publish AUR
    needs:
      - release
      - build
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: System dependencies
        run: pacman -Syu --noconfirm --needed git openssh
      - uses: actions/checkout@v4
      - name: Render PKGBUILD
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          GLIBC: ${{ needs.build.outputs.glibc }}
          AUR_MAINTAINER_EMAIL: ${{ vars.AUR_MAINTAINER_EMAIL || 'rouhim@users.noreply.github.com' }}
        run: |
          set -eu
          mkdir -p aur-build
          sed -e "s|__VERSION__|$VERSION|g" \
              -e "s|__SHA256__|$SHA256|g" \
              -e "s|__GLIBC__|$GLIBC|g" \
              -e "s|__MAINTAINER_EMAIL__|$AUR_MAINTAINER_EMAIL|g" \
              packaging/PKGBUILD > aur-build/PKGBUILD
          cp packaging/littera-bin.install aur-build/littera-bin.install
          # makepkg refuses to run as root; .SRCINFO is the only thing needed.
          useradd --create-home builder
          chown -R builder:builder aur-build
          su builder -c "cd '$PWD/aur-build' && makepkg --printsrcinfo > .SRCINFO"
          chown -R root:root aur-build
      # The rendered files are uploaded for inspection and for a manual replay;
      # the push below is what actually creates the package on a first release.
      - name: Upload rendered PKGBUILD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: littera-bin-${{ needs.release.outputs.version }}
          include-hidden-files: true
          path: |
            aur-build/PKGBUILD
            aur-build/.SRCINFO
            aur-build/littera-bin.install
      - name: Push to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_USERNAME: ${{ vars.AUR_USERNAME || 'rouhim' }}
          AUR_MAINTAINER_EMAIL: ${{ vars.AUR_MAINTAINER_EMAIL || 'rouhim@users.noreply.github.com' }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -eu
          if [ -z "${AUR_SSH_KEY:-}" ]; then
            echo "::error::The AUR_SSH_KEY repository secret is not set. Add the passphrase-less key whose public half is registered in the AUR account (Settings -> Secrets and variables -> Actions), then re-run this job."
            exit 1
          fi
          install -d -m 700 /root/.ssh
          # Normalise paste artefacts (CRLF, leading/trailing blank lines) before
          # ssh ever looks at the key.
          printf '%s\n' "$AUR_SSH_KEY" | tr -d '\r' | awk 'NF' > /root/.ssh/aur
          chmod 600 /root/.ssh/aur
          if ! grep -q '^-----BEGIN .*PRIVATE KEY-----$' /root/.ssh/aur \
             || ! grep -q '^-----END .*PRIVATE KEY-----$' /root/.ssh/aur; then
            echo "::error::AUR_SSH_KEY does not contain a private key. Store the private key file (starts with '-----BEGIN OPENSSH PRIVATE KEY-----'), never the .pub, as the repository secret under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          install -Dm644 .github/aur_known_hosts /root/.ssh/known_hosts
          # Secrets cannot be read back after they are stored. The fingerprint
          # is public information (it is printed by `ssh-keygen -lf` on the
          # .pub too) and makes the stored key identifiable in the log.
          ssh-keygen -lf /root/.ssh/aur
          if ssh-keygen -y -P '' -f /root/.ssh/aur >/dev/null 2>&1; then
            echo "stored key: no passphrase"
          else
            echo "::warning::The stored key is passphrase-protected; BatchMode cannot answer the prompt."
          fi
          export GIT_SSH_COMMAND="ssh -i /root/.ssh/aur -o IdentitiesOnly=yes -o BatchMode=yes -o UserKnownHostsFile=/root/.ssh/known_hosts -o StrictHostKeyChecking=yes"

          if ! git clone --depth 1 ssh://aur@aur.archlinux.org/littera-bin.git aur 2>/tmp/clone.err; then
            cat /tmp/clone.err
            if grep -qiE 'permission denied|invalid format|no such identity' /tmp/clone.err; then
              echo "::error::AUR authentication failed. The public half of the AUR_SSH_KEY key must be registered at https://aur.archlinux.org/account/rouhim, and the secret must hold the passphrase-less private key."
            else
              echo "::error::The AUR remote could not be cloned although the key was accepted. Check the runner's network access and AUR's rate limit (repeated failed auth attempts are throttled per IP); the rendered PKGBUILD is in the littera-bin-$VERSION artifact."
            fi
            exit 1
          fi

          cp aur-build/PKGBUILD aur-build/.SRCINFO aur-build/littera-bin.install aur/

          cd aur
          git config user.name "$AUR_USERNAME"
          git config user.email "$AUR_MAINTAINER_EMAIL"
          git add PKGBUILD .SRCINFO littera-bin.install
          if git diff --cached --quiet; then
            echo "littera-bin is already at $VERSION-1"
            exit 0
          fi
          git commit -m "upgpkg: littera-bin $VERSION-1"
          git push origin master
